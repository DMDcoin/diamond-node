name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.85.1"

      - name: Run cargo check
        run: cargo check --locked --all --benches --verbose --tests

      - name: Run cargo check mio io
        run: cargo check --locked --manifest-path crates/runtime/io/Cargo.toml --features mio --verbose

      - name: Run cargo check evmbin
        run: cargo check --locked -p evmbin --verbose

      - name: Run validate chainspecs
        run: ./scripts/actions/validate-chainspecs.sh

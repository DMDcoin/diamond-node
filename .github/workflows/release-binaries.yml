# Build the tagged commit, attest and upload release artifacts.
# Run manually for an existing tags.
name: Release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: "1.85.1"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.release.outputs.version }}
      track: ${{ steps.release.outputs.track }}
      features: ${{ steps.release.outputs.features }}

    steps:
      - name: Require existing tag
        if: github.event_name != 'workflow_dispatch' || github.ref_type != 'tag'
        run: |
          echo "::error::Request this workflow for an existing release tag."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Validate tag and versions
        id: release
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for package in diamond-node parity-version; do
            version=$(jq -er --arg name "$package" '.packages[] | select(.name == $name) | .version' <<< "$metadata")
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::$package version must match $GITHUB_REF_NAME"
              exit 1
            fi
          done
          track=stable
          features=diamond-node/final
          if [[ "${version%%+*}" == *-* ]]; then
            track=unstable
            features=
          fi
          printf 'version=%s\ntrack=%s\nfeatures=%s\n' "$version" "$track" "$features" >> "$GITHUB_OUTPUT"

  build:
    name: Build (linux-${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TRACK: ${{ needs.prepare.outputs.track }}
      FEATURES: ${{ needs.prepare.outputs.features }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: ${{ matrix.arch == 'amd64' && 'recursive' || 'false' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: binaries-${{ matrix.runner }}

      - name: Run tests
        if: matrix.arch == 'amd64'
        run: cargo test --locked --release --workspace --features "$FEATURES"

      - name: Build binaries
        run: cargo build --locked --release --features "$FEATURES" -p diamond-node -p dmd -p hbbft_config_generator

      - name: Package binaries
        run: |
          epoch=$(git show -s --format=%ct HEAD)
          name="diamond-node-$VERSION-linux-$ARCH"
          stage="dist/$name"
          target="${CARGO_TARGET_DIR:-target}/release"
          bins=(diamond-node dmd hbbft_config_generator)
          mkdir -p "$stage"
          for bin in "${bins[@]}"; do cp "$target/$bin" "$stage/$bin"; done
          cp LICENSE "$stage/LICENSE"
          printf '%s\n' \
            "name=$name" "version=$VERSION" "archive_version=$VERSION" \
            "revision=$GITHUB_SHA" "arch=$ARCH" "track=$BUILD_TRACK" \
            "rustc=$(rustc --version)" "source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "runtime=Ubuntu 24.04 or newer, glibc 2.39+, libstdc++6, libgcc-s1" > "$stage/BUILD_INFO"
          (cd "$stage"; sha256sum "${bins[@]}" LICENSE BUILD_INFO > SHA256SUMS)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist "$name" | gzip -n > "dist/$name.tar.gz"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Attest and upload artifacts
    needs: [ prepare, build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download archives from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          path: release
          merge-multiple: true

      - name: Check archive and create checksums
        working-directory: release
        run: |
          archives=("diamond-node-$VERSION-linux-amd64.tar.gz" "diamond-node-$VERSION-linux-arm64.tar.gz")
          actual=(*.tar.gz)
          [[ "${actual[*]}" == "${archives[*]}" ]] || {
            echo "::error::Exactly one amd64 and one arm64 archive for this release are required"; exit 1;
          }
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Attest archives and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.tar.gz
            release/SHA256SUMS
          create-storage-record: false

      - name: Verify attestations and checksums
        working-directory: release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" provenance.sigstore.jsonl
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-binaries.yml@$GITHUB_REF"
          for file in *.tar.gz SHA256SUMS; do
            gh attestation verify "$file" --bundle provenance.sigstore.jsonl \
              --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          cmp SHA256SUMS <(sha256sum -- *.tar.gz)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/provenance.sigstore.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
